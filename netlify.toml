[build]
  command = "npm ci && npm run release:build"
  publish = "dist/release-candidate"

[build.environment]
  NODE_VERSION = "22"

# Netlify publishes only the privacy-minimized release candidate generated by
# scripts/build_release_candidate.js. The repository root, tests, docs, and
# local-only appraisal inputs are not part of the deployed site.
