<style>
:root{
  --bg:#09090b;--bg2:#111113;--card:#171717;--card2:#1f1f23;--line:#34343a;--line2:#52525b;
  --text:#f5f5f4;--muted:#a8a29e;--soft:#d6d3d1;--burg:#7f1d1d;--burg2:#991b1b;
  --gold:#b45309;--gold2:#f59e0b;--blue:#1d4ed8;--green:#047857;--purple:#6d28d9;
  --danger:#dc2626;--warn:#d97706;--safe:#059669;--bottom:54px;--radius:10px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font-family:"Pretendard","Apple SD Gothic Neo","Noto Sans KR",system-ui,-apple-system,sans-serif;letter-spacing:-.035em}
body{padding-bottom:calc(var(--bottom) + env(safe-area-inset-bottom) + 8px)}
button,input,textarea,select{font-family:inherit}
button{cursor:pointer}
body.external{--burg:#1e3a8a;--burg2:#1d4ed8;--gold:#0f766e;--gold2:#14b8a6}
.top{position:sticky;top:0;z-index:50;background:rgba(9,9,11,.98);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.line{height:36px;display:flex;align-items:center;gap:8px;padding:5px 9px;border-bottom:1px solid rgba(255,255,255,.05)}
.logo{width:25px;height:25px;border-radius:7px;display:grid;place-items:center;background:linear-gradient(145deg,var(--burg),#111);border:1px solid rgba(255,255,255,.14);font-weight:950;font-size:12px}
.title{font-size:14px;font-weight:950;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.version{font-size:10px;color:#e7e5e4;border:1px solid var(--line);border-radius:999px;padding:3px 6px}
.toggle{border:1px solid var(--line);background:#111;color:#fff;border-radius:999px;padding:6px 8px;font-size:11px;font-weight:850}
.toggle.on{background:#064e3b;border-color:#059669;color:#d1fae5}
.router{padding:6px 8px 6px}
.row{display:flex;gap:5px;overflow-x:auto;scrollbar-width:none}
.row::-webkit-scrollbar{display:none}
.tab{border:1px solid var(--line);background:#121214;color:#d6d3d1;border-radius:8px;padding:6px 8px;font-size:11.5px;font-weight:850;white-space:nowrap;min-height:30px}
.tab.on{background:var(--burg);border-color:#ef4444;color:#fff}
.views{margin-top:5px}
.views .tab.on{background:#24190e;border-color:var(--gold2);color:#fde68a}
.context{display:flex;gap:5px;overflow-x:auto;padding:0 8px 6px}
.ctx{font-size:10.5px;color:#d6d3d1;border:1px solid var(--line);background:#111;border-radius:999px;padding:4px 7px;white-space:nowrap}
.ctx.gold{border-color:var(--gold);color:#fde68a}.ctx.red{border-color:#7f1d1d;color:#fecaca}.ctx.green{border-color:#065f46;color:#bbf7d0}
main{padding:7px;max-width:1320px;margin:0 auto}
.panel{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:9px;margin-bottom:7px}
.panel.tight{padding:7px}.panel.red{border-color:#7f1d1d}.panel.gold{border-color:#92400e}.panel.green{border-color:#065f46}
h1,h2,h3,p{margin:0} h2{font-size:15px;margin-bottom:6px;font-weight:950} h3{font-size:13px;margin-bottom:5px;font-weight:900}
p,li{font-size:12px;line-height:1.45;color:var(--soft)} small{font-size:10.5px;color:var(--muted)}
.badge{display:inline-flex;border:1px solid var(--line);background:#101012;color:#e7e5e4;border-radius:999px;padding:3px 6px;font-size:10px;font-weight:850;margin:0 3px 4px 0;white-space:nowrap}
.badge.red{border-color:#7f1d1d;background:rgba(127,29,29,.25);color:#fecaca}.badge.gold{border-color:#92400e;background:rgba(146,64,14,.25);color:#fde68a}
.badge.blue{border-color:#1e3a8a;background:rgba(30,58,138,.25);color:#bfdbfe}.badge.green{border-color:#065f46;background:rgba(6,95,70,.25);color:#bbf7d0}
.badge.purple{border-color:#581c87;background:rgba(88,28,135,.25);color:#ddd6fe}
.grid3{display:grid;grid-template-columns:1fr;gap:7px}.grid2{display:grid;grid-template-columns:1fr;gap:7px}
@media(min-width:820px){.grid3{grid-template-columns:repeat(3,1fr)}.grid2{grid-template-columns:repeat(2,1fr)}}
.score{display:flex;align-items:center;gap:8px;margin:6px 0}.scoreNum{width:56px;height:40px;background:#111;border:1px solid var(--line);border-radius:8px;display:grid;place-items:center;font-size:18px;font-weight:950}
.bar{height:8px;background:#2a2a2e;border-radius:999px;overflow:hidden;flex:1}.bar span{display:block;height:100%;background:linear-gradient(90deg,var(--burg2),var(--gold2));border-radius:999px}
.tableWrap{overflow:auto;border:1px solid var(--line);border-radius:8px;background:#111}
table{width:100%;border-collapse:collapse;font-size:11.4px}
th,td{border-bottom:1px solid #29292d;border-right:1px solid #29292d;padding:6px 7px;vertical-align:top;line-height:1.38}
th{background:#111113;color:#fff;text-align:left;font-size:10.8px;position:sticky;top:0;z-index:1}td{color:#d6d3d1}td:last-child,th:last-child{border-right:0}tr:last-child td{border-bottom:0}
.item{border:1px solid #303037;border-left:4px solid var(--gold);border-radius:8px;background:#121214;padding:7px;margin-bottom:6px}.item.red{border-left-color:#dc2626}.item.blue{border-left-color:#3b82f6}.item.green{border-left-color:#059669}.item.purple{border-left-color:#7c3aed}
.name{font-size:12.5px;font-weight:950;margin-bottom:2px}.desc{font-size:11.5px;color:#d6d3d1;line-height:1.4}
.tools{display:flex;gap:5px;flex-wrap:wrap;margin:6px 0}.tool{border:1px solid var(--line);background:#111;color:#eee;border-radius:7px;padding:6px 8px;font-size:11px;font-weight:850}.tool.on{border-color:var(--gold2);color:#fde68a;background:#21170c}
input,textarea,select{width:100%;border:1px solid var(--line);background:#0f0f11;color:#fff;border-radius:8px;padding:8px 9px;font-size:12.5px;outline:none}
textarea{min-height:125px;resize:vertical}.copybox{white-space:pre-wrap;background:#0f0f11;border:1px solid var(--line);border-radius:8px;padding:8px;color:#eee;font-size:12px;line-height:1.45}
.result{border-radius:8px;padding:8px;margin-top:7px;border:1px solid var(--line);background:#111}.result.block{border-color:#7f1d1d;background:rgba(127,29,29,.18)}.result.warn{border-color:#92400e;background:rgba(146,64,14,.18)}.result.pass{border-color:#065f46;background:rgba(6,95,70,.18)}
.nav{position:fixed;left:0;right:0;bottom:0;height:calc(var(--bottom) + env(safe-area-inset-bottom));z-index:60;display:flex;gap:4px;padding:5px 5px calc(5px + env(safe-area-inset-bottom));background:rgba(9,9,11,.98);border-top:1px solid var(--line);overflow-x:auto}
.nav button{min-width:62px;flex:1;border:1px solid var(--line);background:#111;color:#d6d3d1;border-radius:8px;font-size:10.3px;font-weight:850;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px}.nav b{font-size:15px}.nav button.on{border-color:var(--gold2);background:#21170c;color:#fde68a}
.toast{position:fixed;left:50%;bottom:calc(var(--bottom) + 18px);transform:translateX(-50%);background:#111;border:1px solid var(--line);border-radius:999px;padding:7px 10px;font-size:11px;font-weight:900;display:none;z-index:100}
@media(max-width:430px){.title{font-size:13px}.version{display:none}.toggle{font-size:10px;padding:5px 7px}main{padding:6px}.panel{padding:8px;margin-bottom:6px}.tab{font-size:11px;padding:6px 7px}th,td{padding:5px 6px;font-size:10.7px}}

.dataBtns{display:flex;gap:6px;flex-wrap:wrap;margin:7px 0}.dataBtns button,.dataBtns label{border:1px solid var(--line);background:#111;color:#eee;border-radius:7px;padding:7px 9px;font-size:11px;font-weight:850;display:inline-flex;align-items:center;gap:4px}.dataBtns .hot{border-color:var(--gold2);color:#fde68a;background:#21170c}.dataBtns .danger{border-color:#7f1d1d;color:#fecaca;background:rgba(127,29,29,.18)}
.formgrid{display:grid;grid-template-columns:1fr;gap:6px}.formgrid.two{grid-template-columns:1fr}@media(min-width:720px){.formgrid.two{grid-template-columns:1fr 1fr}.formgrid.three{grid-template-columns:1fr 1fr 1fr}}
pre.jsonbox{white-space:pre-wrap;word-break:break-word;background:#0f0f11;border:1px solid var(--line);border-radius:8px;padding:8px;color:#e7e5e4;font-size:10.7px;line-height:1.35;max-height:260px;overflow:auto}
.fileInput{display:none}.mini{font-size:10.5px;color:var(--muted);line-height:1.35}.kbd{border:1px solid var(--line);border-radius:5px;padding:1px 4px;background:#111;color:#fde68a;font-size:10px}
</style>
</head>

<script>
const STORE_KEY='kk_v45_state';
const DATA_KEY='kk_v45_caseData';
let caseData=loadCaseData();
let state=loadState();

function loadCaseData(){
  try{
    const saved=localStorage.getItem(DATA_KEY);
    if(saved) return normalizeData(JSON.parse(saved));
  }catch(e){}
  const raw=document.getElementById('defaultCaseData').textContent;
  return normalizeData(JSON.parse(raw));
}
function loadState(){
  try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch(e){return {}}
}
state=Object.assign({axis:'all',view:'overview',external:false,text:'',addType:'submission'},state||{});
function save(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify(caseData))}
function normalizeData(d){
  d=d||{}; d.metadata=d.metadata||{};
  d.axes=d.axes||[]; d.views=d.views||[]; d.tracks=d.tracks||[];
  d.axisData=d.axisData||{}; d.evidenceRegistry=d.evidenceRegistry||[]; d.redTeams=d.redTeams||[];
  d.precedents=d.precedents||[]; d.weaknesses=d.weaknesses||[]; d.submissionLogs=d.submissionLogs||[];
  d.timeline=d.timeline||[]; d.issueLinks=d.issueLinks||[]; d.submitGuardRules=d.submitGuardRules||[]; d.patchLog=d.patchLog||[];
  if(!d.axes.some(a=>a.id==='all')) d.axes.unshift({id:'all',label:'전체',icon:'◇'});
  if(!d.views.some(v=>v.id==='data')) d.views.push({id:'data',label:'데이터관리',icon:'↕'});
  return d;
}
function match(axes){axes=axes||[];if(state.axis==='all')return true;if(state.axis==='common')return axes.includes('common');return axes.includes(state.axis)||axes.includes('common')}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function cleanWords(s){if(!state.external)return String(s??'');let x=String(s??'');[['킬러','핵심'],['승률','입증 가능성'],['스모킹 건','주요 입증자료'],['보복 확정','신고 후 불이익처우로 평가될 여지'],['명백','강하게 의심되는'],['조작','자료와 불일치하는 기재'],['악의','부당하게 볼 여지가 있는 경위'],['사측','피신청인']].forEach(([a,b])=>x=x.split(a).join(b));return x}
function e(s){return esc(cleanWords(s))}
function badge(t,c=''){return `<span class="badge ${c}">${e(t)}</span>`}
function setAxis(id){state.axis=id;save();render()}
function setView(id){state.view=id;save();render();scrollTo({top:0,behavior:'smooth'})}
function toggleMode(){state.external=!state.external;save();render()}
function toast(msg='처리됨'){let t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1400)}
function axes(){return caseData.axes||[]}
function views(){return caseData.views||[]}
function currentAxisLabel(){return (axes().find(a=>a.id===state.axis)||axes()[0]||{}).label||state.axis}
function renderHeader(){
 document.body.className=state.external?'external':'';
 document.getElementById('modeBtn').className='toggle '+(state.external?'on':'');
 document.getElementById('modeBtn').textContent=state.external?'외부안전':'내부전략';
 document.getElementById('title').textContent=state.external?'노동사건 대응 통합보드 v4.5':'전략OS v4.5 Data-Driven Evidence Pack';
 document.querySelector('.version').textContent='v4.5';
 document.getElementById('axisRow').innerHTML=axes().map(a=>`<button class="tab ${state.axis===a.id?'on':''}" onclick="setAxis('${a.id}')">${a.icon||''} ${e(a.label)}</button>`).join('');
 document.getElementById('viewRow').innerHTML=views().map(v=>`<button class="tab ${state.view===v.id?'on':''}" onclick="setView('${v.id}')">${v.icon||''} ${e(v.label)}</button>`).join('');
 document.getElementById('context').innerHTML=[
  `<span class="ctx gold">축=${e(currentAxisLabel())}</span>`,
  `<span class="ctx">데이터=${e(caseData.metadata?.version||'caseData')}</span>`,
  `<span class="ctx red">JSON Import/Export</span>`,
  `<span class="ctx green">오프라인 내장 데이터</span>`
 ].join('');
 document.getElementById('bottomNav').innerHTML=views().map(v=>`<button class="${state.view===v.id?'on':''}" onclick="setView('${v.id}')"><b>${v.icon||''}</b><span>${e(v.label)}</span></button>`).join('');
}
function axisList(){return state.axis==='all'?Object.keys(caseData.axisData||{}):[state.axis]}
function axisPanel(id){
 const d=(caseData.axisData||{})[id]; if(!d)return '';
 return `<section class="panel red">${badge(d.agency||'','blue')}${badge('내부예측 '+(d.score||''),'gold')}${badge('신뢰도 '+(d.conf||''),(d.conf||'').includes('상')?'green':'')}<h2>${e(d.name||id)}</h2><div class="score"><div class="scoreNum">${e(d.mid??'-')}</div><div class="bar"><span style="width:${Number(d.mid||60)}%"></span></div></div><p>${e(d.verdict||'')}</p><div class="tableWrap" style="margin-top:7px"><table><tr><th>쟁점</th><td>${(d.issues||[]).map(x=>badge(x,'blue')).join('')}</td></tr><tr><th>치명증거</th><td>${(d.evidence||[]).map(x=>'• '+e(x)).join('<br>')}</td></tr><tr><th>약점</th><td>${(d.weak||[]).map(x=>'• '+e(x)).join('<br>')}</td></tr><tr><th>다음 액션</th><td>${(d.next||[]).map(x=>'• '+e(x)).join('<br>')}</td></tr></table></div></section>`;
}
function overview(){
 return `<div class="panel gold"><h2>v4.5 데이터 분리형 릴리즈</h2><p>기존 v4.4.2 내용은 유지하되 사건 데이터를 caseData JSON으로 분리했습니다. 앞으로는 HTML 전체를 다시 만들지 않고, 데이터관리 탭에서 JSON Import/Export 또는 수동 추가로 운영합니다.</p><div class="dataBtns"><button class="hot" onclick="setView('data')">데이터관리로 이동</button><button onclick="exportData()">현재 JSON 내보내기</button></div></div><div class="grid3">${axisList().map(axisPanel).join('')}</div><div class="panel"><h2>최우선 보강</h2><div class="tableWrap"><table><tr><th>순위</th><th>보강자료</th><th>이유</th><th>대체자료</th></tr><tr><td>1</td><td>4.10 이전 해고 결재문서</td><td>“해고는 이미 예정” 프레임 차단</td><td>3.19 면담·징계 미개최 발언</td></tr><tr><td>2</td><td>AI 사용 묵인 기록</td><td>무단 AI·업무품질 공격 차단</td><td>임신웅 AI 자동화 긍정 대화</td></tr><tr><td>3</td><td>의료자료 최소범위 정리</td><td>개인질병 프레임 차단</td><td>진단서·처방전·심리검사 마스킹본</td></tr></table></div></div>`;
}
function submissions(){
 return `<div class="panel gold"><h2>기관별 제출이력 Lock</h2><p>노동청 트랙과 노동위 트랙을 분리하되, 공통 연결축은 2026.4.10 신고·인지 → 2026.4.13 해고 실행입니다.</p></div><div class="panel"><h2>제출이력표</h2><div class="tableWrap"><table><tr><th>제출일</th><th>기관</th><th>트랙</th><th>제출자료</th><th>핵심효과</th></tr>${caseData.submissionLogs.map(x=>`<tr><td>${e(x.date)}</td><td>${badge(x.agency,x.agency?.includes('노동청')?'blue':'gold')}</td><td>${e(x.track)}</td><td>${e(x.materials)}</td><td>${e(x.point)}</td></tr>`).join('')}</table></div></div><div class="panel"><h2>메인 타임라인</h2><div class="tableWrap"><table><tr><th>일자</th><th>사실관계</th><th>판단상 의미</th><th>연결증거</th></tr>${caseData.timeline.map(x=>`<tr><td><b>${e(x.date)}</b></td><td>${e(x.event)}</td><td>${e(x.meaning)}</td><td>${e(x.evidence)}</td></tr>`).join('')}</table></div></div><div class="panel"><h2>쟁점별 연결표</h2><div class="tableWrap"><table><tr><th>쟁점</th><th>연결증거</th><th>논리</th></tr>${caseData.issueLinks.map(x=>`<tr><td><b>${e(x.issue)}</b></td><td>${e(x.evidence)}</td><td>${e(x.logic)}</td></tr>`).join('')}</table></div></div><div class="panel"><h2>SubmitGuard 추가 규칙</h2><div class="tableWrap"><table><tr><th>구분</th><th>차단/경고</th><th>권장표현</th></tr>${caseData.submitGuardRules.map(x=>`<tr><td>${badge(x.type,x.type==='금지'?'red':'blue')}</td><td>${e(x.rule)}</td><td>${e(x.replace)}</td></tr>`).join('')}</table></div></div>`;
}
function sgrade(){const list=caseData.evidenceRegistry.filter(x=>match(x.axis));return `<div class="panel"><h2>Evidence Registry</h2><p>기관별 track 필드를 포함한 데이터형 증거카드입니다. 외부 제출 시 실제 기관별 호증번호를 별도로 확인하십시오.</p></div><div class="tableWrap"><table><tr><th>ID</th><th>기관/트랙</th><th>등급</th><th>자료/핵심문구</th><th>입증취지</th><th>상대공격</th><th>방어·안전문장</th></tr>${list.map(x=>`<tr><td><b>${e(x.id)}</b></td><td>${badge(x.agency||'',x.agency?.includes('노동청')?'blue':'gold')}<br><small>${e(x.track||'')}</small></td><td>${badge(x.level||'',x.level==='S'?'red':'gold')}</td><td><b>${e(x.src)}</b><br>${e(x.quote)}</td><td>${e(x.purpose)}</td><td>${e(x.attack)}</td><td><b>방어:</b> ${e(x.def)}<br><b>외부:</b> ${e(x.safe)}</td></tr>`).join('')}</table></div>`}
function redteam(){const list=caseData.redTeams.filter(x=>match(x.axis));return `<div class="panel red"><h2>상대 변호사 레드팀 공격표</h2><p>공격 가능성이 높은 순서로 차단문장과 연결증거를 배치했습니다.</p></div><div class="tableWrap"><table><tr><th>위험</th><th>공격 주장</th><th>우리 약점</th><th>즉시 차단문장</th><th>연결증거</th></tr>${list.map(x=>`<tr><td>${badge(x.risk,x.risk==='상'?'red':'gold')}</td><td>${e(x.attack)}</td><td>${e(x.weak)}</td><td>${e(x.block)}</td><td>${e(x.ev)}</td></tr>`).join('')}</table></div>`}
function precedent(){const list=caseData.precedents.filter(x=>match(x.axis));return `<div class="panel gold"><h2>판례 원문검증 Lock</h2><p>직접 인용/조건부 인용/내부 참고를 구분합니다. 조건부 판례는 외부 제출 전 원문과 사실관계 대조가 필요합니다.</p></div><div class="tableWrap"><table><tr><th>법리·판례</th><th>원문 취지</th><th>본건 적용</th><th>인용등급</th><th>리스크</th></tr>${list.map(x=>`<tr><td><b>${e(x.name)}</b></td><td>${e(x.rule)}</td><td>${e(x.apply)}</td><td>${badge(x.cite,x.cite?.includes('직접')?'green':'gold')}</td><td>${e(x.risk)}</td></tr>`).join('')}</table></div>`}
function weak(){const list=caseData.weaknesses.filter(x=>match(x.axis));return `<div class="panel red"><h2>약점 격리소</h2><p>상대가 반드시 찌를 지점입니다. 감정적으로 방어하지 말고, 격리·하향·보조자료화 원칙으로 대응합니다.</p></div><div class="tableWrap"><table><tr><th>약점</th><th>공격위험</th><th>격리/방어 원칙</th><th>금지표현</th></tr>${list.map(x=>`<tr><td><b>${e(x.title)}</b></td><td>${e(x.risk)}</td><td>${e(x.hold)}</td><td>${e(x.ban)}</td></tr>`).join('')}</table></div>`}
function analyze(txt){
 let s=String(txt||''), f=[]; const pairs=[['킬러','핵심'],['변호사킬러','내부전략'],['아킬레스건','핵심쟁점'],['작전','대응방향'],['승률','입증 가능성'],['100%','상당한 정도로'],['무조건','구체적 사실관계에 따라'],['보복 확정','신고 후 불이익처우로 평가될 여지'],['명백한 보복','신고 후 불이익처우로 평가될 여지가 있는 정황'],['조작','자료와 불일치하는 기재'],['악의','부당하게 볼 여지가 있는 경위'],['허위신고','사실관계와 다른 기재 여부 확인 필요'],['회사 때문에 병','회사 인지 및 보호조치 필요성'],['무조건 보복해고','신고 후 불이익처우로 평가될 여지가 있는 정황'],['명백한 범죄','법 위반 여부 확인이 필요한 정황']];
 pairs.forEach(([a,b])=>{if(s.includes(a)){f.push(`위험표현: ${a} → ${b}`);s=s.split(a).join(b)}});
 (caseData.submitGuardRules||[]).forEach(r=>{ if(r.rule && /무조건|명백|정신질환|해고 무효|업무능력 부족|인사위원회/.test(s) && (s.includes('무조건')||s.includes('명백')||s.includes('정신질환')||s.includes('해고 무효')||s.includes('진료기록')||s.includes('인사위원회'))){} });
 if(/노\s*제\s*8\s*호증\s*의\s*3\s*내지\s*9/.test(s)){f.push('노증번호 오류: 노 제8호증의 3 내지 9는 노 제9호증으로 정정');s=s.replace(/노\s*제\s*8\s*호증\s*의\s*3\s*내지\s*9/g,'노 제9호증')}
 if(/이직확인서/.test(s)&&!/노\s*제\s*10\s*호증/.test(s))f.push('노증번호 확인: 이직확인서 자료는 노 제10호증 기준');
 if(/\d{6}-\d{7}/.test(s)){f.push('주민등록번호 감지');s=s.replace(/\d{6}-\d{7}/g,'[주민등록번호 마스킹]')}
 if(/환자번호|처방전번호|요양기관번호|파록스|웰부트린|부스피론|레피졸|날트렉손|리튬|스리반|클로나제팜|인데놀|트라조돈|멜라토닌/.test(s))f.push('의료 식별정보/약물명 감지: 마스킹 또는 목적 제한 문구 필요');
 if(/진료기록.*업무능력|업무능력.*진료기록|아파서.*해고|정신질환.*해고/.test(s))f.push('진료기록 역공 위험: 업무능력 부족 자인 아님 문구 필요');
 if(/무조건.*보복|명백한.*범죄|정신질환 때문에 괴롭/.test(s))f.push('단정 표현 위험: 불이익처우 정황·확인 필요 표현으로 수정');
 if(/노동청/.test(s)&&/해고.*무효/.test(s))f.push('기관 목적 혼동: 노동청 문서는 해고 무효보다 조사·보호조치·불이익처우 확인 중심');
 if(/인사위원회.*무조건.*무효|무조건.*인사위원회.*무효/.test(s))f.push('인사위원회 단정 위험: 징계성 해고라면 절차 문제라는 조건부 표현 필요');
 if(/5,511|5511|29\.9%|884/.test(s))f.push('구수치 감지: 기제출 수치인지 최신 확정 수치인지 구분 필요');
 if(/해고예고수당.*인센티브|인센티브.*해고예고수당/.test(s))f.push('해고예고수당과 인센티브 혼용 위험');
 const status=f.some(x=>x.includes('주민등록번호')||x.includes('혼용')||x.includes('노증번호 오류'))?'block':f.length?'warn':'pass'; return {status,f,s}
}
function checker(){const r=analyze(state.text||'');return `<div class="panel"><h2>제출검사</h2><textarea placeholder="제출문 초안을 붙여넣으세요." oninput="state.text=this.value;save();render()">${esc(state.text||'')}</textarea></div><div class="result ${r.status}"><h2>${r.status.toUpperCase()}</h2>${r.f.length?`<ul>${r.f.map(x=>`<li>${e(x)}</li>`).join('')}</ul>`:'<p>치명 위험표현은 감지되지 않았습니다.</p>'}<h3>정제문</h3><div class="copybox">${e(r.s)}</div><button class="tool on" onclick="copyClean()">정제문 복사</button></div>`}
function copyClean(){navigator.clipboard?.writeText(analyze(state.text||'').s);toast('정제문 복사됨')}
function dataView(){
 const jsonPreview=JSON.stringify(caseData,null,2);
 return `<div class="panel gold"><h2>데이터관리 — JSON Evidence Pack</h2><p>v4.5부터는 HTML 본체를 매번 갈아엎지 않고, caseData JSON만 불러오거나 내보내는 방식으로 운영합니다.</p><div class="dataBtns"><label class="hot" for="importFile">JSON 불러오기</label><input id="importFile" class="fileInput" type="file" accept="application/json,.json" onchange="importDataFile(this.files[0])"><button onclick="exportData()">현재 JSON 내보내기</button><button onclick="copyData()">JSON 복사</button><button class="danger" onclick="resetData()">기본값 복원</button></div><p class="mini">Import는 현재 브라우저 저장 데이터를 덮어씁니다. Export 파일은 백업본으로 보관하세요.</p></div>${manualAddPanel()}<div class="panel"><h2>현재 caseData 미리보기</h2><pre class="jsonbox">${esc(jsonPreview.slice(0,12000))}${jsonPreview.length>12000?'\n... 이하 생략. Export로 전체 확인 가능.':''}</pre></div>`;
}
function manualAddPanel(){
 return `<div class="panel"><h2>새 자료 수동 추가</h2><div class="tools"><button class="tool ${state.addType==='submission'?'on':''}" onclick="state.addType='submission';save();render()">제출이력</button><button class="tool ${state.addType==='evidence'?'on':''}" onclick="state.addType='evidence';save();render()">증거카드</button><button class="tool ${state.addType==='timeline'?'on':''}" onclick="state.addType='timeline';save();render()">타임라인</button></div>${state.addType==='evidence'?evidenceForm():state.addType==='timeline'?timelineForm():submissionForm()}</div>`;
}
function input(id,label,ph=''){return `<label><small>${e(label)}</small><input id="${id}" placeholder="${e(ph)}"></label>`}
function textareaInput(id,label,ph=''){return `<label><small>${e(label)}</small><textarea id="${id}" placeholder="${e(ph)}"></textarea></label>`}
function submissionForm(){return `<div class="formgrid two">${input('subDate','제출일','2026.05.09')}${input('subAgency','기관','노동청 / 서울지노위')}${input('subTrack','트랙','직장 내 괴롭힘 / 부당해고')}${input('subMaterials','제출자료','자료명')}${textareaInput('subPoint','핵심효과','무엇을 입증하는지')}</div><div class="dataBtns"><button class="hot" onclick="addSubmission()">제출이력 추가</button></div>`}
function evidenceForm(){return `<div class="formgrid two">${input('evId','ID','노동청-괴-260509-자료명')}${input('evAxes','축','harassment,common')}${input('evTrack','트랙','labor_office_harassment')}${input('evAgency','기관','노동청')}${input('evSrc','자료명','녹취 발췌문')}${input('evLevel','등급','S/A')}${textareaInput('evQuote','핵심문구','핵심 발언 또는 요지')}${textareaInput('evPurpose','입증취지','쟁점과 효과')}${textareaInput('evAttack','예상반박','상대방 주장')}${textareaInput('evDef','재반박','우리 방어')}${textareaInput('evSafe','외부 안전문장','제출문에 쓸 수 있는 문장')}</div><div class="dataBtns"><button class="hot" onclick="addEvidence()">증거카드 추가</button></div>`}
function timelineForm(){return `<div class="formgrid two">${input('tlDate','일자','2026.05.09')}${input('tlEvidence','연결증거','증거 ID')}${textareaInput('tlEvent','사실관계','무슨 일이 있었는지')}${textareaInput('tlMeaning','판단상 의미','왜 중요한지')}</div><div class="dataBtns"><button class="hot" onclick="addTimeline()">타임라인 추가</button></div>`}
function val(id){return document.getElementById(id)?.value?.trim()||''}
function addSubmission(){caseData.submissionLogs.push({date:val('subDate'),agency:val('subAgency'),track:val('subTrack'),materials:val('subMaterials'),point:val('subPoint')});saveData();toast('제출이력 추가됨');setView('submissions')}
function addEvidence(){caseData.evidenceRegistry.push({id:val('evId'),axis:val('evAxes').split(',').map(x=>x.trim()).filter(Boolean),track:val('evTrack'),agency:val('evAgency'),src:val('evSrc'),quote:val('evQuote'),purpose:val('evPurpose'),attack:val('evAttack'),def:val('evDef'),safe:val('evSafe'),level:val('evLevel')});saveData();toast('증거카드 추가됨');setView('sgrade')}
function addTimeline(){caseData.timeline.push({date:val('tlDate'),event:val('tlEvent'),meaning:val('tlMeaning'),evidence:val('tlEvidence')});caseData.timeline.sort((a,b)=>String(a.date).localeCompare(String(b.date)));saveData();toast('타임라인 추가됨');setView('submissions')}
function exportData(){const blob=new Blob([JSON.stringify(caseData,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='case_data_export_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500);toast('JSON 내보내기 시작')}
function copyData(){navigator.clipboard?.writeText(JSON.stringify(caseData,null,2));toast('JSON 복사됨')}
function importDataFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{caseData=normalizeData(JSON.parse(reader.result));saveData();toast('JSON 불러오기 완료');render()}catch(e){alert('JSON 파싱 실패: '+e.message)}};reader.readAsText(file,'utf-8')}
function resetData(){if(!confirm('저장된 caseData를 지우고 기본 내장 데이터로 복원할까요?'))return;localStorage.removeItem(DATA_KEY);caseData=loadCaseData();toast('기본값 복원됨');render()}
function render(){renderHeader();const viewFns={overview,submissions,sgrade,redteam,precedent,weak,checker,data:dataView};document.getElementById('app').innerHTML=(viewFns[state.view]||overview)()}
render();
</script>
