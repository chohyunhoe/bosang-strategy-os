name: Release Candidate CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  five-stage-rc:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brief_output/requirements.txt
      # 산출물 센터는 로컬 출력 브리지를 통해 실제 DOCX/XLSX/CSV 를 만든다.
      # 이 의존성이 없으면 브리지가 formats 를 비워서 보고하고 생성 버튼이 정상적으로 비활성화되므로,
      # 산출 E2E 를 실제로 검증하려면 CI 에도 설치해야 한다(skip 으로 green 만들지 않는다).
      - run: python -m pip install -r brief_output/requirements.txt
      - run: npm audit --omit=dev --omit=optional --audit-level=high
      - run: npm run test:rc
      - name: Check JavaScript syntax
        run: find browser parser/src parser/tests scripts tests \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: git diff --check
      - name: Upload privacy-minimized release candidate
        uses: actions/upload-artifact@v4
        with:
          name: bosang-os-five-stage-rc
          path: dist/release-candidate
          if-no-files-found: error
          retention-days: 7

  responsive-browser:
    needs: five-stage-rc
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brief_output/requirements.txt
      # 산출물 센터는 로컬 출력 브리지를 통해 실제 DOCX/XLSX/CSV 를 만든다.
      # 이 의존성이 없으면 브리지가 formats 를 비워서 보고하고 생성 버튼이 정상적으로 비활성화되므로,
      # 산출 E2E 를 실제로 검증하려면 CI 에도 설치해야 한다(skip 으로 green 만들지 않는다).
      - run: python -m pip install -r brief_output/requirements.txt
      - run: npx playwright install --with-deps chromium webkit
      - name: Verify the local output bridge can produce DOCX/XLSX/CSV
        run: |
          node -e '
            const status = require("./scripts/output_bridge.js").bridgeStatus();
            console.log(JSON.stringify(status));
            const missing = ["DOCX", "XLSX", "CSV"].filter((f) => !status.formats.includes(f));
            if (missing.length) {
              console.error("missing output capability", missing.join(", "));
              process.exit(1);
            }
          '
      - run: npm run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
