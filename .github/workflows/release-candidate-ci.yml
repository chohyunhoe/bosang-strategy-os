name: Release Candidate CI

on:
  pull_request:
  push:
    branches: [main]
  # 수동 실행: 기능 브랜치에서 반응형 브라우저 테스트를 PR 없이 재확인할 때(쓰기 권한 필요)
  workflow_dispatch:

permissions:
  contents: read

jobs:
  five-stage-rc:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brief_output/requirements.txt
      # 산출물 센터는 로컬 출력 브리지를 통해 실제 DOCX/XLSX/CSV 를 만든다.
      # 이 의존성이 없으면 브리지가 formats 를 비워서 보고하고 생성 버튼이 정상적으로 비활성화되므로,
      # 산출 E2E 를 실제로 검증하려면 CI 에도 설치해야 한다(skip 으로 green 만들지 않는다).
      - run: python -m pip install -r brief_output/requirements.txt
      - run: npm audit --omit=dev --omit=optional --audit-level=high
      - run: npm run test:rc
      - name: Check JavaScript syntax
        run: find browser parser/src parser/tests scripts tests \( -name '*.js' -o -name '*.mjs' \) -print0 | xargs -0 -n1 node --check
      - run: git diff --check
      - name: Upload privacy-minimized release candidate
        uses: actions/upload-artifact@v4
        with:
          name: bosang-os-five-stage-rc
          path: dist/release-candidate
          if-no-files-found: error
          retention-days: 7

  responsive-browser:
    needs: five-stage-rc
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # 브라우저와 시스템 의존성이 미리 설치된 공식 Playwright 이미지에서 실행한다.
    # 매 실행마다 Ubuntu 패키지 미러에서 WebKit 의존성을 apt로 받던 단계(0.7~29.7분, 시간 초과 취소)를 없앤다.
    # 이미지 태그는 package-lock.json의 @playwright/test 버전과 같아야 한다(아래 검증 단계가 불일치 시 실패).
    container:
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --user 1001 --ipc=host --init
    env:
      PLAYWRIGHT_IMAGE_VERSION: '1.54.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brief_output/requirements.txt
      # 산출물 센터는 로컬 출력 브리지를 통해 실제 DOCX/XLSX/CSV 를 만든다.
      # 이 의존성이 없으면 브리지가 formats 를 비워서 보고하고 생성 버튼이 정상적으로 비활성화되므로,
      # 산출 E2E 를 실제로 검증하려면 CI 에도 설치해야 한다(skip 으로 green 만들지 않는다).
      - run: python -m pip install -r brief_output/requirements.txt
      - name: Verify preinstalled Playwright browsers (no apt, no download)
        run: |
          set -e
          v=$(npx playwright --version | awk '{print $2}')
          echo "@playwright/test $v / image $PLAYWRIGHT_IMAGE_VERSION"
          if [ "$v" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test $v does not match container image v$PLAYWRIGHT_IMAGE_VERSION — update container.image and PLAYWRIGHT_IMAGE_VERSION together"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const { chromium, webkit } = require("@playwright/test");
            for (const b of [chromium, webkit]) {
              const p = b.executablePath();
              if (!fs.existsSync(p)) { console.error("missing preinstalled browser:", b.name(), p); process.exit(1); }
              console.log("ok", b.name(), p);
            }
          '
      - name: Verify the local output bridge can produce DOCX/XLSX/CSV
        run: |
          node -e '
            const status = require("./scripts/output_bridge.js").bridgeStatus();
            console.log(JSON.stringify(status));
            const missing = ["DOCX", "XLSX", "CSV"].filter((f) => !status.formats.includes(f));
            if (missing.length) {
              console.error("missing output capability", missing.join(", "));
              process.exit(1);
            }
          '
      - run: npm run test:browser
      - name: Upload browser failure evidence
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-failure-evidence
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
