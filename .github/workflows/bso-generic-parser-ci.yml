name: Generic Appraisal Parser CI

on:
  pull_request:
    paths:
      - 'bso/**'
      - '.github/workflows/bso-generic-parser-ci.yml'
  push:
    branches:
      - fix/individual-factor-detail-breakdown-20260803
    paths:
      - 'bso/**'
      - '.github/workflows/bso-generic-parser-ci.yml'

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bso
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: bso/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m compileall -q src tests
      - run: pytest -q
