name: Product v2 CI

on:
  pull_request:
    paths:
      - 'browser/product-v2/**'
      - 'parser/**'
      - 'brief_output/**'
      - 'bso/**'
      - 'scripts/build_product_v2_candidate.js'
      - 'scripts/run_appraisal_acceptance.js'
      - 'scripts/output_bridge.js'
      - 'scripts/public_data_bridge.*'
      - 'scripts/map_bridge.js'
      - 'scripts/local_map_runtime.js'
      - 'tests/local_map_runtime.test.js'
      - 'scripts/serve_product_v2.js'
      - 'scripts/bso_transport_bridge.js'
      - 'scripts/build_n8n_bso_transport.js'
      - 'tests/bso_transport*.test.js'
      - 'tests/product_v2_candidate.test.js'
      - 'tests/product_v2_public_bridge.test.js'
      - 'tests/product_v2_map_bridge.test.js'
      - 'tests/product-v2-browser/**'
      - 'playwright.product-v2.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-v2-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    # 브라우저와 시스템 의존성이 미리 설치된 공식 Playwright 이미지에서 실행한다.
    # 매 실행마다 Ubuntu 패키지 미러에서 WebKit 의존성을 apt로 받던 단계(0.7~29.7분, 시간 초과 취소)를 없앤다.
    # 이미지 태그는 package-lock.json의 @playwright/test 버전과 같아야 한다(아래 검증 단계가 불일치 시 실패).
    container:
      image: mcr.microsoft.com/playwright:v1.54.1-noble
      options: --user 1001 --ipc=host --init
    env:
      PLAYWRIGHT_IMAGE_VERSION: '1.54.1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brief_output/requirements.txt
      - run: npm ci
      - name: Install Output Center dependencies
        run: python -m pip install -r brief_output/requirements.txt
      - name: Desktop sync transport contracts
        run: node --test tests/bso_transport*.test.js
      - name: Parser and Product v2 static gates
        run: |
          node tests/local_map_runtime.test.js
          npm run parser:test
      - name: Verify preinstalled Playwright browsers (no apt, no download)
        run: |
          set -e
          v=$(npx playwright --version | awk '{print $2}')
          echo "@playwright/test $v / image $PLAYWRIGHT_IMAGE_VERSION"
          if [ "$v" != "$PLAYWRIGHT_IMAGE_VERSION" ]; then
            echo "::error::@playwright/test $v does not match container image v$PLAYWRIGHT_IMAGE_VERSION — update container.image and PLAYWRIGHT_IMAGE_VERSION together"
            exit 1
          fi
          node -e '
            const fs = require("fs");
            const { chromium, webkit } = require("@playwright/test");
            for (const b of [chromium, webkit]) {
              const p = b.executablePath();
              if (!fs.existsSync(p)) { console.error("missing preinstalled browser:", b.name(), p); process.exit(1); }
              console.log("ok", b.name(), p);
            }
          '
      - name: Product v2 desktop/mobile E2E
        run: npm run product:v2:e2e
      - name: Verify no legacy runtime entered Product v2 candidate
        run: |
          test -f dist/product-v2-candidate/product-v2-manifest.json
          ! grep -R "mobile-review-p0\|mobile-review-router\|stable16" dist/product-v2-candidate --exclude=parser-bundle.js

