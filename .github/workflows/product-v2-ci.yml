name: Product v2 CI

on:
  pull_request:
    paths:
      - 'browser/product-v2/**'
      - 'parser/**'
      - 'brief_output/**'
      - 'bso/**'
      - 'scripts/build_product_v2_candidate.js'
      - 'scripts/run_appraisal_acceptance.js'
      - 'scripts/output_bridge.js'
      - 'scripts/public_data_bridge.*'
      - 'scripts/map_bridge.js'
      - 'scripts/local_map_runtime.js'
      - 'tests/local_map_runtime.test.js'
      - 'scripts/serve_product_v2.js'
      - 'tests/product_v2_candidate.test.js'
      - 'tests/product_v2_public_bridge.test.js'
      - 'tests/product_v2_map_bridge.test.js'
      - 'tests/product-v2-browser/**'
      - 'playwright.product-v2.config.js'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/product-v2-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  product-v2-gate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: brief_output/requirements.txt
      - run: npm ci
      - name: Install Output Center dependencies
        run: python -m pip install -r brief_output/requirements.txt
      - name: Parser and Product v2 static gates
        run: |
          node tests/local_map_runtime.test.js
          npm run parser:test
      - name: Install browser engines
        run: npx playwright install --with-deps chromium webkit
      - name: Product v2 desktop/mobile E2E
        run: npm run product:v2:e2e
      - name: Verify no legacy runtime entered Product v2 candidate
        run: |
          test -f dist/product-v2-candidate/product-v2-manifest.json
          ! grep -R "mobile-review-p0\|mobile-review-router\|stable16" dist/product-v2-candidate --exclude=parser-bundle.js
