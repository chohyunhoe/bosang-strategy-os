name: LK GIS Agent CI

on:
  pull_request:
    paths:
      - "lk-gis-agent/**"
      - "docs/LK_GIS_Recipe_Engine_v0.1_구현설계서_v1.md"
      - ".github/workflows/lk-gis-agent-ci.yml"
  push:
    branches: [main]
    paths:
      - "lk-gis-agent/**"
      - ".github/workflows/lk-gis-agent-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: lk-gis-agent
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: lk-gis-agent/pyproject.toml
      - name: Install
        run: python -m pip install -e ".[dev]"
      - name: Ruff
        run: ruff check app tests
      - name: Pytest
        run: pytest
      - name: Compile
        run: python -m compileall -q app tests
