S_REVIEW","priority":"중"},{"queue_id":"RQ_004","module":"issueCandidates","target_id":"ISSUE_004","title":"쟁점 후보 검토","review_status_code":"NEEDS_REVIEW","priority":"중"},{"queue_id":"RQ_005","module":"issueCandidates","target_id":"ISSUE_005","title":"쟁점 후보 검토","review_status_code":"NEEDS_REVIEW","priority":"중"},{"queue_id":"RQ_006","module":"issueCandidates","target_id":"ISSUE_006","title":"쟁점 후보 검토","review_status_code":"NEEDS_REVIEW","priority":"중"},{"queue_id":"RQ_007","module":"issueCandidates","target_id":"ISSUE_007","title":"쟁점 후보 검토","review_status_code":"NEEDS_REVIEW","priority":"중"},{"queue_id":"RQ_008","module":"ocrReview","target_id":"OCR_001","title":"토지별 단가","review_status_code":"NEEDS_REVIEW","priority":"LOW"},{"queue_id":"RQ_009","module":"ocrReview","target_id":"OCR_002","title":"크롭 좌표","review_status_code":"NEEDS_REVIEW","priority":"MEDIUM"}],"patchLog":[{"version":"v0.1","date":"2026-05-08","summary":"Excel/CSV 데이터 구조 및 쟁점·초안 문장 흐름 확정"},{"version":"v0.1-review-pack","date":"2026-05-11","summary":"킬러키트형 단일 HTML 데이터팩 구조로 재구성"}]}</script>
<script>
const STORE_KEY='bosang_review_pack_v01_state';
const DATA_KEY='bosang_review_pack_v01_caseData';
let caseData=loadCaseData();
let state=Object.assign({axis:'all',view:'dashboard',safeMode:false,text:'',addType:'land'},loadState());
function loadState(){try{return JSON.parse(localStorage.getItem(STORE_KEY)||'{}')}catch(e){return {}}}
function saveState(){localStorage.setItem(STORE_KEY,JSON.stringify(state))}
function loadCaseData(){try{const saved=localStorage.getItem(DATA_KEY);if(saved)return normalizeData(JSON.parse(saved))}catch(e){}return normalizeData(JSON.parse(document.getElementById('defaultCaseData').textContent))}
function saveData(){localStorage.setItem(DATA_KEY,JSON.stringify(caseData))}
function normalizeData(d){d=d||{};['metadata','caseSummary'].forEach(k=>d[k]=d[k]||{});['axes','views','modules','appraisalRegistry','landRegistry','standardLandRegistry','transactionCaseRegistry','individualFactorReviews','otherFactorReviews','issueCandidates','draftSentences','riskRules','extractionLogs','sourceRegistry','reviewQueue','patchLog'].forEach(k=>d[k]=Array.isArray(d[k])?d[k]:[]);return d}
function esc(s){return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]))}
function softText(s){let x=String(s??'');const pairs=[['가능성 높다','검토 필요성이 있음'],['오류','차이 또는 확인 필요'],['문제 있음','검토 필요'],['부당','산정근거 확인 필요'],['위법','원문 및 근거 확인 필요'],['확정','검토 후 확정 필요'],['정답','검토용 참고'],['무조건','자료 확인 후'],['반드시','추가 검토 후']];pairs.forEach(([a,b])=>x=x.split(a).join(b));return x}
function out(s){return esc(state.safeMode?softText(s):s)}
function badge(t,c=''){return `<span class="badge ${c}">${out(t)}</span>`}
function statusLabel(c){const m={CONFIRMED:'확정',NEEDS_REVIEW:'검토필요',AUTO_EXTRACTED:'자동추출',MISSING:'누락',MANUAL_EDITED:'수동보정',TEXT_PARSED:'텍스트추출',TEXT_PARSE_FAILED:'텍스트추출실패',OCR_REQUIRED:'OCR검수필요',QUERIED:'공적자료조회',NOT_RUN:'미실행',PNU_CANDIDATE_CREATED:'PNU후보'};return m[c]||String(c||'미분류').replaceAll('_',' ')}
function statusClass(c){c=String(c||'');if(c.includes('CONFIRMED')||c.includes('PARSED')||c.includes('QUERIED'))return 'green';if(c.includes('OCR')||c.includes('REVIEW')||c.includes('MISSING'))return 'gold';if(c.includes('FAILED'))return 'red';return 'blue'}
function money(n){if(n===null||n===undefined||n==='')return '-';return Number(n).toLocaleString('ko-KR')}
function pct(n){if(n===null||n===undefined||n==='')return '-';return (Number(n)*100).toFixed(1)+'%'}
function setAxis(id){state.axis=id;saveState();render()}
function setView(id){state.view=id;saveState();render();scrollTo({top:0,behavior:'smooth'})}
function toggleMode(){state.safeMode=!state.safeMode;saveState();render()}
function toast(msg='처리됨'){const t=document.getElementById('toast');t.textContent=msg;t.style.display='block';setTimeout(()=>t.style.display='none',1300)}
function currentAxis(){return (caseData.axes.find(a=>a.id===state.axis)||caseData.axes[0]||{}).label||'전체'}
function axisViews(){return caseData.views}
function renderHeader(){document.body.className=state.safeMode?'safe':'';document.getElementById('modeBtn').className='toggle '+(state.safeMode?'on':'');document.getElementById('modeBtn').textContent=state.safeMode?'제출안전':'내부검토';document.getElementById('axisRow').innerHTML=caseData.axes.map(a=>`<button class="tab ${state.axis===a.id?'on':''}" onclick="setAxis('${a.id}')">${a.icon||''} ${out(a.label)}</button>`).join('');document.getElementById('viewRow').innerHTML=axisViews().map(v=>`<button class="tab ${state.view===v.id?'on':''}" onclick="setView('${v.id}')">${v.icon||''} ${out(v.label)}</button>`).join('');document.getElementById('context').innerHTML=[`<span class="ctx gold">축=${out(currentAxis())}</span>`,`<span class="ctx blue">모드=${state.safeMode?'제출안전':'내부검토'}</span>`,`<span class="ctx green">단일 HTML</span>`,`<span class="ctx red">전문판단 확정 금지</span>`].join('');document.getElementById('bottomNav').innerHTML=caseData.views.map(v=>`<button class="${state.view===v.id?'on':''}" onclick="setView('${v.id}')"><b>${v.icon||''}</b><span>${out(v.label)}</span></button>`).join('')}
function filterByAxis(list, key='axis'){if(state.axis==='all')return list;return (list||[]).filter(x=>x[key]===state.axis||(Array.isArray(x[key])&&x[key].includes(state.axis))||x.module===state.axis)}
function dashboard(){const c=caseData.caseSummary;const totals=c.appraisal_totals||[];const results=c.land_appraisal_results||[];const highRisk=caseData.riskRules.filter(r=>r.severity==='HIGH').length;const needs=[...caseData.reviewQueue].filter(x=>String(x.review_status_code||'').includes('REVIEW')).length;let totalAmounts=totals.map(t=>t.grand_total_amount||t.land_total_amount).filter(Boolean);let spread=totalAmounts.length?Math.max(...totalAmounts)-Math.min(...totalAmounts):0;return `<section class="panel gold"><h2>${out(c.case_name||'보상평가 검토 사건')}</h2><p>${out('이 화면은 평가 결과를 산출하거나 대체하지 않고, 평가서 입력값과 현장·검수자료를 구조화해 검토 필요 항목을 정리하는 MVP 시연본입니다.')}</p></section><section class="grid4"><div class="kpi blue"><div class="k">평가서</div><div class="v">${caseData.appraisalRegistry.length}</div></div><div class="kpi green"><div class="k">대상필지</div><div class="v">${caseData.landRegistry.length}</div></div><div class="kpi gold"><div class="k">검토대기</div><div class="v">${needs}</div></div><div class="kpi red"><div class="k">리스크규칙</div><div class="v">${highRisk}</div></div></section><section class="panel"><h2>평가법인별 총액 흐름</h2><div class="tableWrap"><table><tr><th>평가법인</th><th class="num">토지총액</th><th class="num">지장물</th><th class="num">합계</th><th>상태</th></tr>${totals.map(t=>`<tr><td>${out(t.appraisal_company)}</td><td class="num">${money(t.land_total_amount)}</td><td class="num">${money(t.obstacle_total_amount)}</td><td class="num">${money(t.grand_total_amount||t.land_total_amount)}</td><td>${badge(statusLabel(t.review_status_code),statusClass(t.review_status_code))}</td></tr>`).join('')}</table></div><p class="muted" style="margin-top:6px">법인 간 금액 차이: ${money(spread)}원. 이 값은 결론이 아니라 검토용 비교 지표입니다.</p></section><section class="grid2"><div class="panel"><h2>모듈 현황</h2><div class="rec-list">${caseData.modules.map(m=>`<div class="rec"><h3>${out(m.label)}</h3><div class="kv"><div><span>축</span><span>${out(m.axis)}</span></div><div><span>건수</span><span class="num">${m.count}</span></div><div><span>역할</span><span>${out(m.description)}</span></div></div></div>`).join('')}</div></div><div class="panel"><h2>검토 큐</h2>${caseData.reviewQueue.length?caseData.reviewQueue.slice(0,8).map(q=>`<div class="item ${statusClass(q.review_status_code)}"><div class="name">${out(q.title)}</div><div class="desc">${badge(statusLabel(q.review_status_code),statusClass(q.review_status_code))}${badge(q.priority||'중','gold')} ${out(q.module)} / ${out(q.target_id)}</div></div>`).join(''):'<div class="empty">검토 큐 없음</div>'}</div></section>`}
function appraisalInputs(){const logs=caseData.extractionLogs||[];return `<section class="panel"><h2>평가서 입력값 원장</h2><div class="rec-list">${caseData.appraisalRegistry.map(a=>`<div class="rec"><h3>${out(a.appraisal_company||a.appraisal_id)}</h3><div class="kv"><div><span>파일유형</span><span>${out(a.file_type)}</span></div><div><span>추출방식</span><span>${out(statusLabel(a.extraction_method)||a.extraction_method)}</span></div><div><span>파싱상태</span><span>${badge(statusLabel(a.parse_status),statusClass(a.parse_status))}</span></div><div><span>검수</span><span>${badge(statusLabel(a.review_status_code),statusClass(a.review_status_code))}</span></div></div><p class="muted" style="margin-top:6px">${out(a.source_note||'')}</p></div>`).join('')}</div></section><section class="panel"><h2>추출 로그</h2><div class="tableWrap"><table><tr><th>로그</th><th>출처</th><th>방식</th><th>상태</th><th>메모</th></tr>${logs.map(x=>`<tr><td>${out(x.log_id)}</td><td>${out(x.source_id)}</td><td>${out(x.method)}</td><td>${badge(statusLabel(x.review_status_code),statusClass(x.review_status_code))}</td><td>${out(x.memo)}</td></tr>`).join('')}</table></div></section><section class="panel"><h2>토지별 평가 입력값</h2><div class="tableWrap"><table><tr><th>법인</th><th>필지</th><th>표준지</th><th class="num">개별요인</th><th class="num">그 밖의 요인</th><th class="num">단가</th><th class="num">금액</th><th>추출상태</th></tr>${(caseData.caseSummary.land_appraisal_results||[]).map(r=>`<tr><td>${out(r.appraisal_company)}</td><td>${out(r.parcel_address||r.land_id)}</td><td>${out(r.standard_land_symbol)}</td><td class="num">${r.individual_factor_total??'-'}</td><td class="num">${r.other_factor??'-'}</td><td class="num">${money(r.unit_price)}</td><td class="num">${money(r.amount)}</td><td>${badge(statusLabel(r.extraction_status),statusClass(r.extraction_status))}</td></tr>`).join('')}</table></div></section>`}
function lands(){return `<section class="panel"><h2>필지 검토</h2><div class="rec-list">${caseData.landRegistry.map(l=>`<div class="rec"><h3>${out(l.parcel_address||l.land_id)}</h3><div class="kv"><div><span>지목</span><span>${out(l.land_category)}</span></div><div><span>면적</span><span class="num">${money(l.area)}㎡</span></div><div><span>이용</span><span>${out(l.appraisal_use_status||l.use_note)}</span></div><div><span>공적특성</span><span>${out(l.road_frontage_public||'-')} / ${out(l.terrain_shape_public||'-')}</span></div><div><span>공시지가</span><span class="num">${money(l.official_land_price_public)}</span></div><div><span>검수</span><span>${badge(statusLabel(l.review_status_code),statusClass(l.review_status_code))}</span></div></div></div>`).join('')}</div></section>`}
function standardsCases(){return `<section class="grid2"><div class="panel"><h2>비교표준지</h2><div class="rec-list">${caseData.standardLandRegistry.map(s=>`<div class="rec"><h3>${out((s.appraisal_company||'')+' '+(s.standard_land_symbol||''))}</h3><div class="kv"><div><span>소재지</span><span>${out(s.parcel_address)}</span></div><div><span>지목/이용</span><span>${out(s.land_category)} / ${out(s.use_status)}</span></div><div><span>도로</span><span>${out(s.road_condition||s.road_frontage_public)}</span></div><div><span>공시지가</span><span class="num">${money(s.official_price)}</span></div><div><span>대상필지</span><span>${out((s.selected_for_land_ids||[]).join(', '))}</span></div></div></div>`).join('')}</div></div><div class="panel"><h2>거래사례</h2><p class="muted" style="margin-bottom:7px">사례는 비교표준지가 아니라 그 밖의 요인 검토 참고자료로 관리합니다.</p><div class="rec-list">${caseData.transactionCaseRegistry.map(c=>`<div class="rec"><h3>${out((c.appraisal_company||'')+' '+(c.case_symbol||''))}</h3><div class="kv"><div><span>소재지</span><span>${out(c.parcel_address)}</span></div><div><span>용도/지목</span><span>${out(c.zoning)} / ${out(c.land_category)}</span></div><div><span>사례일</span><span>${out(c.case_date)}</span></div><div><span>사례단가</span><span class="num">${money(c.case_unit_price)}</span></div><div><span>유형</span><span>${out(c.case_type)}</span></div></div></div>`).join('')}</div></div></section>`}
function individualFactors(){return `<section class="panel"><h2>개별요인 검토</h2><div class="tableWrap"><table><tr><th>법인</th><th>필지</th><th>표준지</th><th class="num">접근</th><th class="num">환경</th><th class="num">획지</th><th class="num">행정</th><th class="num">기타</th><th class="num">총계</th><th>상태</th></tr>${caseData.individualFactorReviews.map(x=>`<tr><td>${out(x.appraisal_company)}</td><td>${out(x.land_id||x.parcel_address)}</td><td>${out(x.standard_land_id||x.standard_land_symbol)}</td><td class="num">${x.access_condition??x.access_factor??'-'}</td><td class="num">${x.environment_condition??x.environment_factor??'-'}</td><td class="num">${x.parcel_condition??x.shape_factor??'-'}</td><td class="num">${x.administrative_condition??x.admin_factor??'-'}</td><td class="num">${x.other_condition??x.etc_factor??'-'}</td><td class="num">${x.individual_factor_total??x.total_factor??'-'}</td><td>${badge(statusLabel(x.review_status_code),statusClass(x.review_status_code))}</td></tr>`).join('')}</table></div></section>`}
function otherFactors(){return `<section class="panel"><h2>그 밖의 요인 검토</h2><p class="muted" style="margin-bottom:7px">적용단가 구조와 사례·표준지 간 대조를 검토자료로 표시합니다. 보정치 목표 제시는 하지 않습니다.</p><div class="tableWrap"><table><tr><th>법인</th><th>표준지</th><th>사례</th><th class="num">표준지 적용단가</th><th class="num">사례 적용단가</th><th class="num">검토계수</th><th>메모</th><th>상태</th></tr>${caseData.otherFactorReviews.map(x=>`<tr><td>${out(x.appraisal_company)}</td><td>${out(x.standard_land_id||x.standard_land_symbol)}</td><td>${out(x.comp_case_id||x.case_symbol)}</td><td class="num">${money(x.standard_applied_unit_price||x.standard_land_applied_unit_price)}</td><td class="num">${money(x.case_applied_unit_price||x.comp_case_applied_unit_price)}</td><td class="num">${x.other_factor??x.review_factor??'-'}</td><td>${out(x.review_note||x.memo||'')}</td><td>${badge(statusLabel(x.review_status_code),statusClass(x.review_status_code))}</td></tr>`).join('')}</table></div></section>`}
function issues(){return `<section class="panel"><h2>쟁점후보</h2><div class="rec-list">${caseData.issueCandidates.map(i=>`<div class="rec"><h3>${out(i.issue_title||i.title||i.issue_type||i.issue_id)}</h3><div class="kv"><div><span>유형</span><span>${out(i.issue_type_code||i.issue_type||'-')}</span></div><div><span>필지</span><span>${out(i.land_id||'-')}</span></div><div><span>등급</span><span>${badge(i.review_grade||i.severity||'검토',i.review_grade==='A'?'green':'gold')}</span></div><div><span>상태</span><span>${badge(statusLabel(i.review_status_code),statusClass(i.review_status_code))}</span></div></div><p class="muted" style="margin-top:6px">${out(i.confirmed_fact||i.fact||i.review_note||i.interpretation||'확인된 사실과 해석을 분리해 검토 필요')}</p></div>`).join('')}</div></section>`}
function drafts(){return `<section class="panel"><h2>의견서 초안 문장</h2><p class="muted" style="margin-bottom:7px">제출안전 모드에서는 확정·단정형 표현을 자동 완화해 표시합니다.</p>${caseData.draftSentences.map(d=>`<div class="item blue"><div class="name">${out(d.template_id||d.draft_sentence_id||'문장 후보')}</div><div class="desc">${out(d.safe_sentence||d.draft_sentence_safe||d.final_sentence||d.draft_sentence_raw||d.sentence||'문장 없음')}</div><div style="margin-top:5px">${badge(statusLabel(d.filter_result_code||d.review_status_code),'gold')} ${badge(d.reflection_status||d.draft_reflection_status||'검토', 'blue')}</div></div>`).join('')||'<div class="empty">초안 문장 없음</div>'}</section>`}
function riskFilter(txt){let s=String(txt||''), findings=[];caseData.riskRules.forEach(r=>{let hit=false;(r.tokens||[]).forEach(t=>{if(t&&s.includes(t))hit=true});if(hit)findings.push({category:r.category,severity:r.severity,rewrite:r.safe_rewrite})});if(/\d{6}\s*[-–]\s*\d{7}/.test(s)){findings.push({category:'개인식별번호 노출',severity:'HIGH',rewrite:'식별번호는 마스킹'});s=s.replace(/\d{6}\s*[-–]\s*\d{7}/g,'[식별번호 마스킹]')}let clean=s;findings.forEach(f=>{clean=softText(clean)});const status=findings.some(f=>f.severity==='HIGH')?'block':findings.length?'warn':'pass';return {status,findings,clean}}
function riskCheck(){const r=riskFilter(state.text);return `<section class="panel"><h2>리스크 검사</h2><textarea placeholder="의견서 초안 문장을 붙여넣으세요." oninput="state.text=this.value;saveState();render()">${esc(state.text)}</textarea></section><section class="result ${r.status}"><h2>${r.status==='pass'?'통과':r.status==='warn'?'주의':'수정필요'}</h2>${r.findings.length?`<ul>${r.findings.map(f=>`<li>${out(f.category)} — ${out(f.rewrite)}</li>`).join('')}</ul>`:'<p>현재 입력문에서 주요 위험 신호가 감지되지 않았습니다.</p>'}<h3>정제문</h3><div class="copybox">${out(r.clean)}</div><button class="tool on" onclick="copyClean()">정제문 복사</button></section><section class="panel"><h2>리스크 규칙</h2><div class="rec-list">${caseData.riskRules.map(rr=>`<div class="rec"><h3>${out(rr.category)}</h3><div class="kv"><div><span>위험도</span><span>${badge(rr.severity,rr.severity==='HIGH'?'red':'gold')}</span></div><div><span>권장</span><span>${out(rr.safe_rewrite)}</span></div></div></div>`).join('')}</div></section>`}
function copyClean(){navigator.clipboard&&navigator.clipboard.writeText(riskFilter(state.text).clean);toast('정제문 복사됨')}
function dataManage(){return `<section class="panel gold"><h2>데이터관리</h2><p>브라우저 내부 저장소로 상태를 보존합니다. 원문 개인정보를 서버에 저장하지 않는 단일 HTML 구조입니다.</p><div class="dataBtns"><label class="hot" for="importFile">JSON Import</label><input id="importFile" class="fileInput" type="file" accept="application/json,.json" onchange="importDataFile(this.files[0])"><button onclick="exportData()">JSON Export</button><button onclick="copyData()">JSON 복사</button><button class="danger" onclick="resetData()">기본값 복원</button></div><p class="mini">원본 JSON은 화면에 직접 펼치지 않습니다. 내보내기 또는 복사 기능으로만 확인합니다.</p></section>${manualAddPanel()}<section class="panel"><h2>패치 로그</h2>${caseData.patchLog.map(p=>`<div class="item green"><div class="name">${out(p.version)} / ${out(p.date)}</div><div class="desc">${out(p.summary)}</div></div>`).join('')}</section>`}
function manualAddPanel(){return `<section class="panel"><h2>수동 추가 UI</h2><div class="tools">${[['land','필지'],['standard','비교표준지'],['comp','거래사례'],['ocr','OCR 검수항목'],['issue','쟁점후보'],['draft','초안문장'],['risk','리스크규칙']].map(([id,lab])=>`<button class="tool ${state.addType===id?'on':''}" onclick="state.addType='${id}';saveState();render()">${lab}</button>`).join('')}</div>${addForm()}</section>`}
function input(id,label,ph=''){return `<label><small>${out(label)}</small><input id="${id}" placeholder="${out(ph)}"></label>`}function area(id,label,ph=''){return `<label><small>${out(label)}</small><textarea id="${id}" placeholder="${out(ph)}"></textarea></label>`}function val(id){return document.getElementById(id)?.value?.trim()||''}
function addForm(){const t=state.addType;if(t==='land')return `<div class="formgrid three">${input('f1','소재지','익명시 ○○동 1-1')}${input('f2','지목','전')}${input('f3','면적','100')}</div><div class="dataBtns"><button class="hot" onclick="addLand()">필지 추가</button></div>`;if(t==='standard')return `<div class="formgrid three">${input('f1','표준지 기호','B')}${input('f2','소재지','익명시 ○○동')}${input('f3','공시지가','503021')}</div><div class="dataBtns"><button class="hot" onclick="addStandard()">비교표준지 추가</button></div>`;if(t==='comp')return `<div class="formgrid three">${input('f1','사례기호','나')}${input('f2','소재지','익명시 ○○동')}${input('f3','사례단가','560420')}</div><div class="dataBtns"><button class="hot" onclick="addComp()">거래사례 추가</button></div>`;if(t==='ocr')return `<div class="formgrid two">${input('f1','항목명','단가')}${input('f2','출처','이미지 PDF')}${area('f3','메모','검수 필요 사유')}</div><div class="dataBtns"><button class="hot" onclick="addOcr()">OCR 항목 추가</button></div>`;if(t==='issue')return `<div class="formgrid two">${input('f1','쟁점명','도로접면 확인')}${input('f2','필지ID','LAND_001')}${area('f3','확인된 사실','자료에서 확인된 사실')}</div><div class="dataBtns"><button class="hot" onclick="addIssue()">쟁점 추가</button></div>`;if(t==='draft')return `<div class="formgrid two">${input('f1','문장ID','DRAFT_001')}${area('f2','문장','제출 가능한 안전문장')}</div><div class="dataBtns"><button class="hot" onclick="addDraft()">초안문장 추가</button></div>`;return `<div class="formgrid two">${input('f1','규칙명','개인정보 노출')}${input('f2','위험도','HIGH')}${area('f3','권장문구','마스킹 필요')}</div><div class="dataBtns"><button class="hot" onclick="addRisk()">리스크 규칙 추가</button></div>`}
function addLand(){caseData.landRegistry.push({land_id:'LAND_NEW_'+Date.now(),parcel_address:val('f1'),land_category:val('f2'),area:Number(val('f3')||0),review_status_code:'NEEDS_REVIEW'});saveData();toast('필지 추가됨');setView('lands')}function addStandard(){caseData.standardLandRegistry.push({standard_land_id:'STD_NEW_'+Date.now(),standard_land_symbol:val('f1'),parcel_address:val('f2'),official_price:Number(val('f3')||0),review_status_code:'NEEDS_REVIEW'});saveData();toast('표준지 추가됨');setView('standardsCases')}function addComp(){caseData.transactionCaseRegistry.push({comp_case_id:'COMP_NEW_'+Date.now(),case_symbol:val('f1'),parcel_address:val('f2'),case_unit_price:Number(val('f3')||0),review_status_code:'NEEDS_REVIEW'});saveData();toast('사례 추가됨');setView('standardsCases')}function addOcr(){caseData.reviewQueue.push({queue_id:'RQ_NEW_'+Date.now(),module:'ocrReview',target_id:val('f1'),title:val('f2')+' '+val('f1'),review_status_code:'NEEDS_REVIEW',priority:'중'});saveData();toast('OCR 항목 추가됨');setView('dashboard')}function addIssue(){caseData.issueCandidates.push({issue_id:'ISSUE_NEW_'+Date.now(),issue_title:val('f1'),land_id:val('f2'),confirmed_fact:val('f3'),review_status_code:'NEEDS_REVIEW',review_grade:'C'});saveData();toast('쟁점 추가됨');setView('issues')}function addDraft(){caseData.draftSentences.push({draft_sentence_id:val('f1'),safe_sentence:val('f2'),review_status_code:'NEEDS_REVIEW'});saveData();toast('초안 추가됨');setView('drafts')}function addRisk(){caseData.riskRules.push({risk_rule_id:'RR_NEW_'+Date.now(),category:val('f1'),severity:val('f2')||'MID',tokens:[val('f1')],safe_rewrite:val('f3')});saveData();toast('규칙 추가됨');setView('riskCheck')}
function exportData(){const blob=new Blob([JSON.stringify(caseData,null,2)],{type:'application/json;charset=utf-8'});const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='bosang_review_pack_caseData_'+new Date().toISOString().slice(0,10)+'.json';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},400);toast('JSON Export 시작')}
function copyData(){navigator.clipboard&&navigator.clipboard.writeText(JSON.stringify(caseData,null,2));toast('JSON 복사됨')}
function importDataFile(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{try{caseData=normalizeData(JSON.parse(reader.result));saveData();toast('JSON Import 완료');render()}catch(e){alert('JSON 파싱 실패: '+e.message)}};reader.readAsText(file,'utf-8')}
function resetData(){if(!confirm('저장된 데이터를 지우고 기본 데이터로 복원할까요?'))return;localStorage.removeItem(DATA_KEY);caseData=loadCaseData();toast('기본값 복원됨');render()}
function render(){renderHeader();const fns={dashboard,appraisalInputs,lands,standardsCases,individualFactors,otherFactors,issues,drafts,riskCheck,dataManage};document.getElementById('app').innerHTML=(fns[state.view]||dashboard)()}
render();
</script>
</body>
</html>
